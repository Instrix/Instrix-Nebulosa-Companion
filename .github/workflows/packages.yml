# Builds every package of the app, on the three desktop platforms, and uploads
# them as artifacts named packages-<os>. Called by ci.yml (main / manual runs)
# and release.yml (tags); can also be run on its own from the Actions tab.
#
#   Linux    .deb, .rpm, .AppImage                       (x86_64, arm64)
#            Electron (Chromium) on the Rust backend: WebKitGTK draws the plots
#            too slowly, so Linux doesn't use Tauri (electron/, src-tauri/src/server.rs)
#   Windows  NSIS setup .exe, .msi, portable .exe (zip)   (x64; arm64: no .msi, WiX has no ARM64)
#   macOS    .dmg, .app (zip)                             (universal: Apple silicon + Intel)
#
# Windows arm64 is cross-compiled on the x64 runner; Linux arm64 builds on
# GitHub's arm64 runner. The arm64 jobs are allowed to fail without stopping a
# release (the runner may not be available to every repository plan).
#
# Runners: Linux x64 builds on the self-hosted runner; the others on GitHub's,
# only with the repository variable HOSTED_RUNNERS = true (see the plan job).
#
# Builds are unsigned (macOS gets an ad-hoc signature): Windows SmartScreen and
# macOS Gatekeeper warn on first launch. See the end of this file for signing.
name: Packages

on:
  workflow_call:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which packages, on which runners. By default only what the self-hosted
  # runner (Linux x64: labels self-hosted, Linux, X64) builds; with the
  # repository variable HOSTED_RUNNERS = true (Settings > Secrets and variables
  # > Actions > Variables) also Linux arm64, Windows and macOS on GitHub's.
  plan:
    name: Plan
    runs-on: [self-hosted, Linux, X64]
    outputs:
      include: ${{ steps.plan.outputs.include }}
    steps:
      - id: plan
        env:
          HOSTED: ${{ vars.HOSTED_RUNNERS }}
          SELF: >-
            [{"name":"Linux x64","os":"ubuntu-22.04","runner":["self-hosted","Linux","X64"],"target":"x86_64-unknown-linux-gnu","bundles":"deb,rpm,appimage","rust-targets":"wasm32-unknown-unknown","deb-arch":"amd64","rpm-arch":"x86_64","artifact":"packages-linux-x64"}]
          HOSTED_LIST: >-
            [{"name":"Linux arm64","os":"ubuntu-22.04-arm","runner":"ubuntu-22.04-arm","target":"aarch64-unknown-linux-gnu","bundles":"deb,rpm,appimage","rust-targets":"wasm32-unknown-unknown","deb-arch":"arm64","rpm-arch":"aarch64","artifact":"packages-linux-arm64","optional":true},
            {"name":"Windows x64","os":"windows-latest","runner":"windows-latest","target":"x86_64-pc-windows-msvc","bundles":"nsis,msi","rust-targets":"wasm32-unknown-unknown","win-arch":"x64","artifact":"packages-windows-x64"},
            {"name":"Windows arm64","os":"windows-latest","runner":"windows-latest","target":"aarch64-pc-windows-msvc","bundles":"nsis","rust-targets":"wasm32-unknown-unknown,aarch64-pc-windows-msvc","win-arch":"arm64","artifact":"packages-windows-arm64","optional":true},
            {"name":"macOS universal","os":"macos-latest","runner":"macos-latest","target":"universal-apple-darwin","bundles":"app,dmg","rust-targets":"wasm32-unknown-unknown,aarch64-apple-darwin,x86_64-apple-darwin","artifact":"packages-macos"}]
        run: |
          if [ "$HOSTED" = "true" ]; then
            echo "include=[${SELF:1:${#SELF}-2},${HOSTED_LIST:1}" | tr -d '\n' >> "$GITHUB_OUTPUT"
          else
            echo "include=$SELF" >> "$GITHUB_OUTPUT"
          fi
          echo >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  package:
    name: ${{ matrix.name }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4

      # a self-hosted runner may have them already, and no password-less sudo
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          PKGS="libudev-dev rpm"
          if ! dpkg -s $PKGS >/dev/null 2>&1; then
            sudo -n apt-get update && sudo -n apt-get install -y $PKGS || { echo "::error::install $PKGS on the runner (sudo apt-get install $PKGS)"; exit 1; }
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json
      - run: npm ci

      # beforeBuildCommand builds the core to WASM and the UI first
      - name: Build (Tauri)
        if: runner.os != 'Linux'
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # Linux: the UI, the backend alone (no Tauri, no WebKitGTK), the Electron shell
      - name: Build (Electron)
        if: runner.os == 'Linux'
        run: |
          npm run build:ui
          cargo build --release --locked -p nebulosa-companion --no-default-features --features server --bin nebulosa-backend
          cd electron
          npm ci
          npm pkg set version=$(node -p "require('../src-tauri/tauri.conf.json').version")
          npx electron-builder --linux deb rpm AppImage --publish never

      - name: Collect the packages
        shell: bash
        run: |
          set -euo pipefail
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          B=target/${{ matrix.target }}/release/bundle
          OUT=packages
          mkdir -p "$OUT"
          N=nebulosa-companion_${VER}
          case "${{ runner.os }}" in
            Linux)
              E=target/electron
              cp $E/*.deb      "$OUT/${N}_${{ matrix.deb-arch }}.deb"
              cp $E/*.rpm      "$OUT/${N}_${{ matrix.rpm-arch }}.rpm"
              cp $E/*.AppImage "$OUT/${N}_${{ matrix.deb-arch }}.AppImage"
              ;;
            Windows)
              A=${{ matrix.win-arch }}
              cp $B/nsis/*-setup.exe    "$OUT/${N}_${A}-setup.exe"
              if compgen -G "$B/msi/*.msi" > /dev/null; then cp $B/msi/*.msi "$OUT/${N}_${A}.msi"; fi
              # portable: the bare executable, no installer (needs the WebView2
              # runtime, which Windows 10 and 11 already have)
              mkdir -p portable
              cp target/${{ matrix.target }}/release/nebulosa-companion.exe "portable/Nebulosa Companion.exe"
              printf '%s\r\n' \
                "Nebulosa Companion ${VER} - portable" \
                "" \
                "Run 'Nebulosa Companion.exe' from any folder; nothing is installed." \
                "It needs the Microsoft Edge WebView2 runtime (included in Windows 10 and 11):" \
                "https://developer.microsoft.com/microsoft-edge/webview2/" \
                "Settings are kept in %LOCALAPPDATA%\\com.instrix.nebulosa.companion." \
                > portable/README.txt
              (cd portable && 7z a -tzip "../$OUT/${N}_${A}-portable.zip" "Nebulosa Companion.exe" README.txt)
              ;;
            macOS)
              cp $B/dmg/*.dmg "$OUT/${N}_universal.dmg"
              ditto -c -k --keepParent "$B/macos/Nebulosa Companion.app" "$OUT/${N}_universal.app.zip"
              ;;
          esac
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packages/*
          if-no-files-found: error

# Signing, when certificates are available (add them as repository secrets and
# pass them to the Build step's env):
#   macOS    APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#            and for notarization APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#            (remove bundle.macOS.signingIdentity "-" from tauri.conf.json)
#   Windows  bundle.windows.certificateThumbprint / signCommand in tauri.conf.json
