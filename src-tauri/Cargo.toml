[package]
name = "nebulosa-companion"
description = "INSTRIX Nebulosa companion app"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "nebulosa_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nbp-core = { path = "../crates/nbp-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread", "io-util"] }
nusb = "0.1"
futures-lite = "2"
log = "0.4"
