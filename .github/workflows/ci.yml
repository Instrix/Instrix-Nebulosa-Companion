# Tests on every push / pull request. On main (and manual runs) also every
# package for Linux, Windows and macOS, as build artifacts. Releases: release.yml.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # the self-hosted runner may have them already, and no password-less sudo
      - name: System libraries (Tauri / WebKitGTK)
        run: |
          PKGS="libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev"
          if ! dpkg -s $PKGS >/dev/null 2>&1; then
            sudo -n apt-get update && sudo -n apt-get install -y $PKGS || { echo "::error::install on the runner: sudo apt-get install $PKGS"; exit 1; }
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # GitHub's runners: a prebuilt wasm-pack. Self-hosted: no sudo there (the
      # action installs its helpers with apt-get and waits on a password), so
      # cargo install, once: it stays in the runner's ~/.cargo/bin
      - if: runner.environment != 'self-hosted'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - if: runner.environment == 'self-hosted'
        name: wasm-pack (self-hosted)
        shell: bash
        run: command -v wasm-pack >/dev/null || cargo install --locked wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust tests (core and backend)
        run: cargo test --workspace --locked
      - name: Backend alone (the Linux app's)
        run: cargo build --locked -p nebulosa-companion --no-default-features --features server --bin nebulosa-backend

      - name: Install UI dependencies
        run: npm ci
      - name: Core to WASM
        run: npm run wasm
      - name: Type check
        run: npm run check
      - name: UI build
        run: npx vite build

  packages:
    name: Packages
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/packages.yml
