# A release: push a tag vX.Y.Z (matching the version in src-tauri/tauri.conf.json)
# and this builds every package and opens a draft GitHub Release with them and
# their SHA-256 checksums. Review the draft, then publish it.
#
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  version:
    name: Tag matches the app version
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # no Node on the self-hosted runner here: the version line read as text
          VER=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json)
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match tauri.conf.json version $VER"
            exit 1
          fi

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml

  release:
    name: Draft release
    needs: packages
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Nebulosa Companion ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
