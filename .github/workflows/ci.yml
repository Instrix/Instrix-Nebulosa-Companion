# Tests on every push / pull request (not for documentation-only changes),
# on the self-hosted runner: free. The packages for Linux, Windows and macOS
# (GitHub-hosted runners: billed, macOS at 10x) only when asked for: a commit
# on main whose message has [package] in it, or Run workflow. Releases (a
# vX.Y.Z tag): release.yml. [skip ci] in a message skips the run altogether.
name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # the self-hosted runner may have them already, and no password-less sudo
      - name: System libraries (Tauri / WebKitGTK)
        run: |
          PKGS="build-essential pkg-config libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev"
          if ! dpkg -s $PKGS >/dev/null 2>&1; then
            sudo -n apt-get update && sudo -n apt-get install -y $PKGS || { echo "::error::install on the runner: sudo apt-get install $PKGS"; exit 1; }
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # no sudo on the self-hosted runner (taiki-e/install-action installs its
      # helpers with apt-get and waits on a password): cargo install, once; it
      # stays in the runner's ~/.cargo/bin
      - name: wasm-pack
        run: command -v wasm-pack >/dev/null || cargo install --locked wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust tests (core and backend)
        run: cargo test --workspace --locked
      - name: Backend alone (the Linux app's)
        run: cargo build --locked -p nebulosa-companion --no-default-features --features server --bin nebulosa-backend

      - name: Install UI dependencies
        run: npm ci
      - name: Core to WASM
        run: npm run wasm
      - name: Type check
        run: npm run check
      - name: UI build
        run: npx vite build
      - name: UI build with the Debug tab
        run: npx vite build --mode debug && test -n "$(ls dist/assets/DebugView-*.js)"
      - name: The normal build leaves the Debug tab out
        run: npx vite build && ! ls dist/assets/DebugView-*.js 2>/dev/null

  packages:
    name: Packages
    needs: test
    # on demand only: Run workflow, or [package] in the message of the commit pushed to main
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[package]'))
    uses: ./.github/workflows/packages.yml
