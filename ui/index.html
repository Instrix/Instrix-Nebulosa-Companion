<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nebulosa Companion</title>
    <script>
      // the theme before the first paint (lib/uiScale.svelte.ts keeps it after): dark by default
      (() => {
        let t = 'dark';
        try {
          t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('nebulosa.theme') || 'dark';
        } catch {}
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
