# A release: push a tag vX.Y.Z (matching the version in src-tauri/tauri.conf.json)
# and this builds every package and opens a draft GitHub Release with them and
# their SHA-256 checksums. Review the draft, then publish it.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Or again for a tag already pushed: Actions > Release > Run workflow, with
# the tag (e.g. v0.2.1). To only publish what an earlier run built (its upload
# failed, say), give that run's ID too (the number in its URL): nothing is
# built again.
#
# Each package is there twice: nebulosa-companion_<version>_<kind> and, the
# same file, nebulosa-companion_<kind>; the second is what
# https://github.com/Instrix/Instrix-Nebulosa-Companion/releases/latest/download/nebulosa-companion_<kind>
# serves, the newest published release's (not a draft or a pre-release).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release, e.g. v0.2.1'
        required: true
      packages_from_run:
        description: "Optional: an earlier Release run's ID; its packages are released, nothing is built"
        required: false
        default: ''

env:
  # the tag: pushed, or given to Run workflow
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  # the packages of an earlier run (packages_from_run)
  actions: read

jobs:
  version:
    name: Tag matches the app version
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check
        run: |
          TAG="${TAG#v}"
          # no Node on the self-hosted runner here: the version line read as text
          VER=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json)
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag v$TAG does not match tauri.conf.json version $VER"
            exit 1
          fi

  packages:
    needs: version
    if: ${{ !inputs.packages_from_run }}
    uses: ./.github/workflows/packages.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  release:
    name: Draft release
    needs: [version, packages]
    # the packages built here, or (packages_from_run) an earlier run's
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.packages.result == 'success' || (needs.packages.result == 'skipped' && inputs.packages_from_run != '')) }}
    # GitHub's runner: a minute of downloading and uploading (the self-hosted one
    # couldn't reach uploads.github.com)
    runs-on: ubuntu-latest
    steps:
      # the changelog
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
          run-id: ${{ inputs.packages_from_run || github.run_id }}
          github-token: ${{ github.token }}
      # a copy of each without the version in its name, so a link to
      # releases/latest/download/<name> always gives the newest release's
      # (the website's Download buttons): nebulosa-companion_x64-setup.exe, …
      - name: Fixed names for the latest-release links
        run: |
          cd release
          VER="${TAG#v}"
          for f in nebulosa-companion_"${VER}"_*; do
            cp -- "$f" "nebulosa-companion_${f#nebulosa-companion_${VER}_}"
          done
          ls -la
      - name: Checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # the release's notes: this version's section of CHANGELOG.md (GitHub's list of
      # the changes since the last release goes under it)
      - name: Release notes
        run: |
          VER="${TAG#v}"
          awk -v v="[$VER]" '/^## \[/ { p = index($0, v) > 0; next } p' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::warning::no section for $VER in CHANGELOG.md"; fi
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ env.TAG }}
          name: Nebulosa Companion ${{ env.TAG }}
          body_path: notes.md
          generate_release_notes: true
          files: release/*
