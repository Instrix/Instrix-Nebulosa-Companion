# Tests on every push / pull request. On main (and manual runs) also every
# package for Linux, Windows and macOS, as build artifacts. Releases: release.yml.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (Tauri / WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust tests (core and backend)
        run: cargo test --workspace --locked
      - name: Backend alone (the Linux app's)
        run: cargo build --locked -p nebulosa-companion --no-default-features --features server --bin nebulosa-backend

      - name: Install UI dependencies
        run: npm ci
      - name: Core to WASM
        run: npm run wasm
      - name: Type check
        run: npm run check
      - name: UI build
        run: npx vite build

  packages:
    name: Packages
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/packages.yml
