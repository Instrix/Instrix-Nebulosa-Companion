[workspace]
resolver = "2"
members = ["crates/nbp-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "UNLICENSED"

[profile.release]
lto = true
codegen-units = 1

# `tauri dev` builds unoptimized, and the core then decodes 6-8x slower (a
# third of a core at 2 MS/s), so the plots stutter. Optimize the core and
# the dependencies in dev builds too; only the app crate stays quick to rebuild.
[profile.dev.package.nbp-core]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
